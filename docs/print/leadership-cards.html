<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elders &amp; Deacons Cards | Bonita OPC</title>

<!-- ============================================================
     LEADERSHIP CONTACT CARDS — how to use it
     ------------------------------------------------------------
     Double-sided US business cards (3.5in x 2in): a front that's the
     same on every card — the church building, darkened, with an
     invitation and service times, so whoever hands the card out is
     also inviting someone — and a back with that person's photo
     bleeding to the edge and their contact details. The five
     Elders/Deacons members from about.html — no card for the
     pulpit, since Bonita currently runs on rotating pulpit supply
     rather than a settled pastor (see sermons.html), and printing a
     card per guest preacher isn't worth the run.

     On screen: a tilted preview of every front/back pair first, for
     reviewing the design — then two flat, precisely-sized print
     sheets below it (fronts, then backs). Only the print sheets
     print; the preview is hidden in the print stylesheet.

     TO PRINT: run the front sheet through the printer first, then
     feed the same paper back in and run the back sheet. The back
     sheet's card order is column-mirrored so it lines up correctly
     if your printer's duplex flips on the LONG edge (the common
     default). If yours flips on the short edge instead, set
     MIRROR_BACK to false below and reprint. Test with one sheet of
     scrap paper before running actual card stock.

     CONFIRM before printing: the email address on the back is a
     placeholder (info@bonitaopc.org) — swap it for the church's
     real inbox, the same way the site marks unconfirmed content
     elsewhere (see README.md).
     ============================================================ -->

<style>
  :root {
    --green: #2f4436; --green-deep: #1c2a20; --green-deepest: #131d16;
    --brass: #b8802a; --brass-bright: #e0ac52; --tile: #a6432a;
    --ink: #241f19; --ink-soft: #4b4239; --muted: #7a6f61; --rule: #d9cdb8; --rule-strong: #b9a98d;
    --stock: #fbf6ec; --plaster: #f3ebdd;
    --font-display: "Vollkorn", Georgia, "Times New Roman", serif;
    --font-body: "Alegreya Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: #3a362f; }
  body { margin: 0; font-family: var(--font-body); color: var(--ink); }

  /* ---------- shared card faces (used by both the mockup and the print sheets) ---------- */
  .card-face { width: 3.5in; height: 2in; position: relative; overflow: hidden; }

  /* Front: the church building, one full-bleed photo edge to edge — no
     frame, no boxed-off panel — with a single even wash over the
     whole image (not a bottom-heavy gradient) so it still reads as
     a photograph, just toned down enough to carry white type. */
  .card-face--front {
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: .2in .24in; color: var(--stock);
  }
  .front-photo {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    object-position: 50% 90%; z-index: 0; /* crop out almost all sky — that hard skyline was the "seam" */
  }
  .card-face--front::before {
    content: ""; position: absolute; inset: 0; z-index: 1;
    background: rgba(15,22,17,.72); /* one flat, even wash — no gradient banding */
  }
  .front-eyebrow, .front-invite, .front-verse, .front-meta { position: relative; z-index: 2; }
  .front-eyebrow {
    font-family: var(--font-body); font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
    font-size: .56rem; color: var(--brass-bright); margin: 0 0 .09in;
  }
  .front-invite {
    font-family: var(--font-display); font-weight: 600; font-size: 1.14rem; color: #fff;
    letter-spacing: .01em; line-height: 1.15; margin: 0 0 .05in;
  }
  .front-verse {
    font-family: var(--font-display); font-style: italic; font-size: .68rem;
    color: var(--brass-bright); margin: 0 0 .1in;
  }
  .front-meta {
    font-size: .62rem; color: rgba(251,246,236,.85); line-height: 1.5;
    border-top: 1px solid rgba(224,172,82,.4); padding-top: .08in; margin: 0;
  }

  /* Back: contact details left, photo bleeding to the card edge right. */
  .card-face--back { display: flex; background: var(--stock); }
  .back-info {
    flex: 1 1 auto; min-width: 0; padding: .22in .2in; display: flex; flex-direction: column; justify-content: center;
  }
  .back-name { font-family: var(--font-display); font-weight: 700; font-size: .92rem; color: var(--green); margin: 0 0 .02in; line-height: 1.25; }
  .back-role { font-family: var(--font-display); font-style: italic; font-size: .74rem; color: var(--tile); margin: 0 0 .11in; }
  .back-org { font-family: var(--font-body); font-variant-caps: small-caps; letter-spacing: .02em; font-size: .68rem; color: var(--ink-soft); margin: 0 0 .09in; }
  .back-line { font-size: .63rem; color: var(--ink-soft); line-height: 1.6; margin: 0; }
  .back-todo {
    display: inline-block; background: var(--brass); color: #3a2a08;
    font-weight: 700; font-size: .5rem; letter-spacing: .03em; padding: .03em .32em; border-radius: 2px;
  }
  .back-photo-wrap {
    flex: 0 0 1.35in; height: 100%; position: relative; overflow: hidden;
    border-left: 3px solid var(--brass);
  }
  .back-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .back-photo-wrap.is-blank {
    display: grid; place-items: center;
    background: radial-gradient(140% 140% at 50% 120%, var(--green-deepest), var(--green-deep) 60%);
  }
  .back-photo-wrap.is-blank span {
    color: rgba(251,246,236,.55); font-family: var(--font-display); font-style: italic; font-size: .68rem;
    text-align: center; line-height: 1.3; padding: 0 .1in;
  }

  /* ---------- on-screen mockup preview (hidden in print) ---------- */
  .mockups { padding: 2.5rem 1.5rem 1rem; max-width: 980px; margin: 0 auto; }
  .mockups h1 { font-family: var(--font-display); color: var(--stock); font-size: 1.4rem; text-align: center; margin: 0 0 .3rem; }
  .mockups p.sub { text-align: center; color: rgba(251,246,236,.55); font-family: var(--font-body); font-size: .92rem; margin: 0 0 2.2rem; }
  .mockup-row {
    display: flex; justify-content: center; align-items: center; gap: 2.6rem;
    padding: 2.2rem 1rem; margin-bottom: 1rem;
  }
  .mockup-row .card-face { border-radius: 5px; box-shadow: 0 20px 38px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.35); }
  .mockup-row .card-face--front { transform: rotate(-4deg) translateY(4px); }
  .mockup-row .card-face--back { transform: rotate(3deg) translateY(-4px); }
  .mockup-label { text-align: center; color: rgba(251,246,236,.4); font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; margin-top: -.6rem; margin-bottom: 1.8rem; }

  /* ---------- print sheets ---------- */
  .sheet-label { text-align: center; color: rgba(251,246,236,.6); font-family: var(--font-body); font-size: .85rem; letter-spacing: .03em; text-transform: uppercase; margin: 2.5rem 0 .5rem; }
  .sheet {
    width: 8.5in; height: 11in; margin: 0 auto 1.5rem; background: #fff;
    padding: .75in .75in; display: grid;
    grid-template-columns: repeat(2, 3.5in); grid-template-rows: repeat(3, 2in);
    justify-content: center; gap: 0;
  }
  .sheet .card-face { border: 1px dashed var(--rule); }
  @media screen { .sheet { box-shadow: 0 6px 24px rgba(0,0,0,.35); } }
  @page { size: letter; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .mockups, .sheet-label { display: none; }
    .sheet { box-shadow: none; margin: 0; page-break-after: always; }
    .sheet:last-of-type { page-break-after: auto; }
  }
</style>
</head>
<body>

<div class="mockups">
  <h1>Elders &amp; Deacons Cards</h1>
  <p class="sub">Front and back, for review — the print-ready sheets follow below</p>
  <div id="mockup-target"></div>
</div>

<p class="sheet-label">Print sheet 1 of 2 — fronts</p>
<div class="sheet" id="front-sheet"></div>

<p class="sheet-label">Print sheet 2 of 2 — backs (column-mirrored to align when flipped on the long edge)</p>
<div class="sheet" id="back-sheet"></div>

<script>
(function () {
  "use strict";
  var MIRROR_BACK = true; // set false if your printer's duplex flips on the short edge

  var PEOPLE = [
    { name: "Mike Chism", role: "Elder", photo: "../../assets/img/chism.jpg" },
    { name: "Lee McMorris", role: "Elder", photo: "../../assets/img/0d314f1f-1630-4745-9dfe-f92c20497b80_1_105_c.jpg" },
    { name: "Maynard Skidmore", role: "Elder", photo: "../../assets/img/skidmore.jpg" },
    { name: "Andy Weld", role: "Elder", photo: "../../assets/img/weld.jpg" },
    { name: "Scott York", role: "Deacon", photo: "../../assets/img/york.jpg" }
  ];

  // One shared "invite" front — the church building, not a person —
  // so every card in the set doubles as an invitation, whoever hands
  // it out. The person's identity lives on the back.
  function frontFace() {
    var face = document.createElement("div");
    face.className = "card-face card-face--front";
    face.innerHTML =
      '<img class="front-photo" src="../../assets/img/church-building-t.jpg" alt="">' +
      '<p class="front-eyebrow">Bonita Orthodox Presbyterian Church</p>' +
      '<p class="front-invite">Join us this Sunday</p>' +
      '<p class="front-verse">&ldquo;Let us go to the house of the Lord.&rdquo;</p>' +
      '<p class="front-meta">Morning 11:00 &middot; Evening 6:00<br>5111 Central Avenue, Bonita, CA</p>';
    return face;
  }

  function backFace(p) {
    var face = document.createElement("div");
    face.className = "card-face card-face--back";

    var info = document.createElement("div");
    info.className = "back-info";
    info.innerHTML =
      '<p class="back-name">' + p.name + '</p>' +
      '<p class="back-role">' + p.role + '</p>' +
      '<p class="back-org">Bonita Orthodox Presbyterian Church</p>' +
            '<p class="back-line">Bonitaopc.5111@gmail.com</p>' +
      '<p class="back-line">bonitaopc.org<br>Bonita, California</p>';
    face.appendChild(info);

    var photoWrap = document.createElement("div");
    photoWrap.className = "back-photo-wrap";
    photoWrap.innerHTML = '<img src="' + p.photo + '" alt="' + p.name + '">';
    face.appendChild(photoWrap);

    return face;
  }

  // Mockup preview: one front + back pair per person, tilted.
  var mockTarget = document.getElementById("mockup-target");
  PEOPLE.forEach(function (p) {
    var row = document.createElement("div");
    row.className = "mockup-row";
    row.appendChild(frontFace(p));
    row.appendChild(backFace(p));
    mockTarget.appendChild(row);
    var label = document.createElement("p");
    label.className = "mockup-label";
    label.textContent = p.name;
    mockTarget.appendChild(label);
  });

  // Print sheet 1: fronts, natural left-to-right order.
  var frontSheet = document.getElementById("front-sheet");
  PEOPLE.forEach(function (p) { frontSheet.appendChild(frontFace(p)); });

  // Print sheet 2: backs, column-mirrored per row so a long-edge duplex
  // flip lines each back up behind its matching front. Works for any
  // count — an odd last person just gets a lone, unmirrored row.
  var backSheet = document.getElementById("back-sheet");
  for (var i = 0; i < PEOPLE.length; i += 2) {
    var pair = PEOPLE.slice(i, i + 2);
    var ordered = (MIRROR_BACK && pair.length === 2) ? [pair[1], pair[0]] : pair;
    ordered.forEach(function (p) { backSheet.appendChild(backFace(p)); });
  }
})();
</script>

</body>
</html>
