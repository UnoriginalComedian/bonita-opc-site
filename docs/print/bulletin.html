<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunday Bulletin | Bonita OPC</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400..700;1,400..600&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

<!-- ============================================================
     WEEKLY BULLETIN — half-fold booklet, how to use it
     ------------------------------------------------------------
     A standard 4-page church bulletin: one letter sheet, printed
     landscape on both sides, folded in half down the middle. Open
     it flat and the fold runs vertically; the panels read, in
     order: front cover, page 2, page 3, back cover.

     Because of how a fold works, the two print sheets are NOT
     "front, back, front, back" in reading order — the OUTSIDE of
     the folded sheet carries the back cover and the front cover
     side by side (back on the left, front on the right, so the
     right panel is what shows when it's folded shut), and the
     INSIDE carries page 2 and page 3 side by side. That is standard
     "booklet imposition," not a mistake in the file below.

     1. Edit the bracketed [ ] placeholders for this week: date,
        hymn numbers, Scripture readings, announcements, prayer list.
     2. Print sheet 1 (outside) on letter paper, LANDSCAPE, then feed
        the same paper back in and print sheet 2 (inside) on the
        other side. Test with scrap paper first — which way to feed
        it back in depends on your printer's duplex direction.
     3. Fold down the middle. Front cover should land on the outside.
     4. Anything still bracketed when it leaves the office is a
        mistake, not a placeholder — see README.md for the same rule
        applied to the website.

     Ink note: the two cover panels carry the color and photo; both
     inside pages are mostly plain stock with only accent color, so
     printing sheet 2 (inside) in black-and-white — most print
     dialogs have a grayscale toggle — cuts ink use substantially
     without losing anything readable. Keep sheet 1 in color.
     ============================================================ -->

<style>
  :root {
    --green: #2f4436; --green-deep: #1c2a20; --green-deepest: #131d16;
    --brass: #b8802a; --brass-bright: #e0ac52; --tile: #a6432a;
    --ink: #241f19; --ink-soft: #4b4239; --muted: #7a6f61;
    --rule: #d9cdb8; --rule-strong: #b9a98d; --stock: #fbf6ec;
    --band-ink: #f4efe3; --band-muted: rgba(244,239,227,.72);
    --font-display: "Vollkorn", Georgia, "Times New Roman", serif;
    --font-body: "Alegreya Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: #3a362f; }
  body { margin: 0; font-family: var(--font-body); color: var(--ink); font-size: 11.5px; line-height: 1.5; }

  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; color: var(--green); margin: 0 0 .3em; }
  p { margin: 0 0 .6em; }
  .cw { font-family: var(--font-display); font-variant-caps: small-caps; letter-spacing: .03em; }
  /* A quiet, editorial way to flag "confirm before printing" — italic and
     tile-colored, like a footnote, not a loud UI badge. The mustard pills
     this replaced looked like website chips dropped onto a printed page. */
  .todo { font-style: italic; font-weight: 600; color: var(--tile); }
  .panel--cover .todo, .panel--back .todo { color: var(--brass-bright); }

  /* ---------- panels (5.5in x 8.5in each — half of a folded letter sheet) ---------- */
  .panel { width: 5.5in; height: 8.5in; position: relative; overflow: hidden; background: #fff; }

  /* Front cover: the photo fills the top two-thirds only — not the whole
     panel — with the logo and verse placed in the open sky rather than
     crammed into a strip at the bottom. A real solid footer band (not text
     floating on the photo) anchors the date and service times below it. */
  .panel--cover { display: flex; flex-direction: column; color: var(--band-ink); }
  .cover-photo-wrap { position: relative; flex: 0 0 5.6in; overflow: hidden; padding: .4in .45in; display: flex; flex-direction: column; }
  .cover-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 55%; z-index: 0; }
  .cover-photo-wrap::before { content: ""; position: absolute; inset: 0; z-index: 1; background: linear-gradient(0deg, rgba(15,22,17,.7) 0%, rgba(15,22,17,.2) 45%, rgba(15,22,17,.35) 100%); }
  .cover-logo, .cover-verse { position: relative; z-index: 2; }
  .cover-logo { height: 46px; width: auto; align-self: flex-start; filter: brightness(0) invert(1); }
  .cover-verse {
    font-family: var(--font-display); font-size: 1.5rem; line-height: 1.32; color: #fff;
    max-width: 4.3in; margin-top: auto; /* sits low in the photo, logo stays up in the sky */
  }
  .cover-verse cite { display: block; font-style: normal; font-variant-caps: small-caps; letter-spacing: .04em; color: var(--brass-bright); font-size: .85rem; margin-top: .15in; }
  .cover-footer {
    flex: 1 1 auto; background: var(--green-deep); padding: .35in .45in; display: flex; flex-direction: column; justify-content: center;
    position: relative;
  }
  .cover-footer::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, var(--brass), var(--brass-bright) 55%, var(--tile)); }
  .cover-footer .cw { font-size: 1.15rem; color: #fff; }
  .cover-footer .cover-times { font-size: .95rem; color: var(--band-muted); margin-top: .08in; }

  /* Back cover: the site's own dark-green "band" surface, not stock — carries
     the same weight as the front, on the outside of the fold. */
  .panel--back {
    background:
      radial-gradient(140% 90% at 15% 0%, rgba(184,128,42,.16), transparent 55%),
      var(--green-deep);
    color: var(--band-ink); padding: .45in .5in; display: flex; flex-direction: column;
    justify-content: space-between; /* three groups, evenly spaced — no one leftover gap */
  }
  .panel--back::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, var(--brass), var(--brass-bright) 55%, var(--tile)); }
  .back-logo { height: 24px; width: auto; align-self: flex-start; filter: brightness(0) invert(1); margin-bottom: .3in; }
  .back-label { font-family: var(--font-display); font-variant-caps: small-caps; letter-spacing: .03em; color: var(--brass-bright); font-size: 1rem; border-bottom: 1px solid rgba(244,239,227,.25); padding-bottom: .07in; margin-bottom: .12in; }
  .back-leaders .row { display: flex; justify-content: space-between; padding: .06in 0; border-bottom: 1px dotted rgba(244,239,227,.2); font-size: .95em; }
  .back-leaders .row .role { color: var(--brass-bright); font-variant-caps: small-caps; }
  .back-giving { font-size: .9em; color: var(--band-muted); margin-top: .18in; }
  .back-middle { text-align: center; padding: 0 .2in; }
  .back-middle .rule-double { border-top-color: rgba(244,239,227,.3); margin: 0 auto .2in; width: 1.4in; }
  .back-middle .back-verse { font-family: var(--font-display); font-style: italic; font-size: 1.15rem; line-height: 1.45; color: var(--band-ink); }
  .back-middle .back-verse cite { display: block; font-style: normal; font-variant-caps: small-caps; letter-spacing: .04em; color: var(--brass-bright); font-size: .85rem; margin-top: .15in; }
  .back-contact { padding-top: .2in; border-top: 1px solid rgba(244,239,227,.25); font-size: .92em; color: var(--band-muted); line-height: 1.6; }
  .back-tagline { font-family: var(--font-display); font-style: italic; font-size: .85rem; color: var(--brass-bright); margin-top: .12in; }

  /* Inside pages: plain stock, accent color only — the pages people actually
     follow along on, so legibility and ink cost both matter here. */
  .panel--inside { padding: .4in .42in; }
  .inside-head { border-bottom: 3px solid var(--brass); padding-bottom: .12in; margin-bottom: .18in; }
  .inside-head .cw { font-size: 1.15rem; color: var(--green); display: block; }
  .inside-head .verse { font-family: var(--font-display); font-style: italic; font-size: .82rem; color: var(--ink-soft); margin-top: .06in; }
  .order-title { text-align: center; font-size: .96rem; margin-bottom: .02in; }
  .order-sub { text-align: center; font-size: .8em; color: var(--muted); margin-bottom: .14in; }
  .liturgy { border-top: 1px solid var(--rule-strong); }
  .liturgy .row { display: grid; grid-template-columns: 1fr auto; gap: .4rem; padding: .1in 0; border-bottom: 1px dotted var(--rule); align-items: baseline; }
  .liturgy .row.hymn { font-style: italic; color: var(--ink-soft); }
  .liturgy .row .what { font-size: .96em; }
  .liturgy .row .ref { font-size: .84em; color: var(--muted); text-align: right; white-space: nowrap; }
  .liturgy .row.sermon .what { font-family: var(--font-display); font-size: 1em; color: var(--green); font-weight: 600; }
  .rule-double { border: 0; border-top: 3px double var(--rule-strong); margin: .18in 0; }
  .section-label { font-family: var(--font-display); font-variant-caps: small-caps; letter-spacing: .03em; color: var(--brass); font-size: .98rem; border-bottom: 1px solid var(--rule); padding-bottom: .06in; margin-bottom: .1in; }
  .announce-item { padding: .1in 0; border-bottom: 1px solid var(--rule); }
  .announce-item:last-child { border-bottom: 0; }
  .announce-item .what { font-family: var(--font-display); font-size: .96rem; color: var(--green); margin-bottom: .02in; }
  .announce-item p { font-size: .9em; color: var(--ink-soft); margin: 0; }
  .prayer-lines { margin-top: .06in; }
  .prayer-lines .line { border-bottom: 1px dotted var(--rule-strong); height: 1.15em; }
  .footnote { font-size: .8em; color: var(--muted); margin-top: .12in; font-style: italic; }

  /* ---------- on-screen mockup (hidden in print) ---------- */
  .mockups { padding: 2.5rem 1.5rem 1rem; max-width: 1040px; margin: 0 auto; }
  .mockups h1 { font-family: var(--font-display); color: var(--stock); font-size: 1.4rem; text-align: center; margin: 0 0 .3rem; }
  .mockups p.sub { text-align: center; color: rgba(251,246,236,.55); font-family: var(--font-body); font-size: .92rem; margin: 0 0 2.4rem; }
  .mockup-block { display: flex; justify-content: center; margin-bottom: 3rem; }
  .mockup-label { text-align: center; color: rgba(251,246,236,.4); font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; margin-top: 1.1rem; }

  /* Closed booklet: front cover panel, angled, with a stack of "paper edges"
     behind it so it reads as a folded booklet, not a flat printout. */
  .mock-closed { position: relative; transform: rotate(-3deg); }
  .mock-closed::before, .mock-closed::after {
    content: ""; position: absolute; inset: 0; background: var(--stock); border: 1px solid var(--rule-strong);
    z-index: -1; border-radius: 2px;
  }
  .mock-closed::before { transform: translate(5px, 6px) rotate(1.4deg); }
  .mock-closed::after { transform: translate(9px, 11px) rotate(2.6deg); background: #efe6d3; }
  .mock-closed .panel { border-radius: 2px; box-shadow: 0 22px 40px rgba(0,0,0,.5), 0 3px 8px rgba(0,0,0,.35); transform: scale(.78); transform-origin: top left; }
  .mock-closed-wrap { width: calc(5.5in * .78); height: calc(8.5in * .78); }

  /* Open spread: page 2 + 3 side by side, flat, with a fold crease down the
     middle and a slight bow to suggest paper lying open. */
  .mock-open { display: flex; transform: scale(.68) rotate(-1.2deg); transform-origin: top center; box-shadow: 0 22px 44px rgba(0,0,0,.5); border-radius: 2px; overflow: hidden; }
  .mock-open .panel:first-child { box-shadow: inset -14px 0 22px -14px rgba(0,0,0,.35); }
  .mock-open .panel:last-child { box-shadow: inset 14px 0 22px -14px rgba(0,0,0,.35); }
  .mock-open-wrap { width: calc(11in * .68); height: calc(8.5in * .68); }

  /* ---------- print sheets ---------- */
  .sheet-label { text-align: center; color: rgba(251,246,236,.6); font-family: var(--font-body); font-size: .85rem; letter-spacing: .03em; text-transform: uppercase; margin: 0 0 .5rem; }
  .landscape-sheet {
    width: 11in; height: 8.5in; margin: 0 auto 1.5rem; display: flex; position: relative;
  }
  .landscape-sheet::after {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 0;
    border-left: 1px dashed var(--rule-strong); pointer-events: none;
  }
  @media screen { .landscape-sheet { box-shadow: 0 6px 24px rgba(0,0,0,.35); } }
  @page { size: 11in 8.5in; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .mockups, .sheet-label { display: none; }
    .landscape-sheet { box-shadow: none; margin: 0; page-break-after: always; }
    .landscape-sheet:last-of-type { page-break-after: auto; }
  }
</style>
</head>
<body>

<div class="mockups">
  <h1>Sunday Bulletin</h1>
  <p class="sub">A half-fold booklet — closed, then open to the inside spread</p>

  <div class="mockup-block">
    <div>
      <div class="mock-closed-wrap mock-closed"><div id="mock-cover"></div></div>
      <p class="mockup-label">Closed — front cover</p>
    </div>
  </div>

  <div class="mockup-block">
    <div>
      <div class="mock-open-wrap mock-open" id="mock-spread"></div>
      <p class="mockup-label">Open — inside spread</p>
    </div>
  </div>
</div>

<p class="sheet-label">Print sheet 1 of 2 — outside (back cover, then front cover)</p>
<div class="landscape-sheet" id="outside-sheet"></div>

<p class="sheet-label">Print sheet 2 of 2 — inside (page 2, then page 3)</p>
<div class="landscape-sheet" id="inside-sheet"></div>

<script>
(function () {
  "use strict";

  function coverPanel() {
    var el = document.createElement("div");
    el.className = "panel panel--cover";
    el.innerHTML =
      '<div class="cover-photo-wrap">' +
        '<img class="cover-photo" src="../../assets/img/church-building-t.jpg" alt="">' +
        '<img class="cover-logo" src="../../assets/img/Bonita-Logo-w.png" alt="Bonita Orthodox Presbyterian Church">' +
        '<p class="cover-verse">&ldquo;Let us go to the house of the L<span style="font-variant-caps:small-caps;">ord</span>.&rdquo;<cite>Psalm 122:1</cite></p>' +
      '</div>' +
      '<div class="cover-footer">' +
        '<p class="cw" style="margin:0;">The Lord&rsquo;s Day &middot; [Month Day, Year] <span class="todo">set weekly</span></p>' +
        '<p class="cover-times">Morning Worship 11:00 &middot; Evening Worship 6:00</p>' +
      '</div>';
    return el;
  }

  function backPanel() {
    var el = document.createElement("div");
    el.className = "panel panel--back";
    el.innerHTML =
      '<div class="back-top">' +
        '<img class="back-logo" src="../../assets/img/Bonita-Logo-w.png" alt="">' +
        '<p class="back-label">Session &amp; Diaconate</p>' +
        '<div class="back-leaders">' +
          '<div class="row"><span>Mike Chism</span><span class="role">Elder</span></div>' +
          '<div class="row"><span>Lee McMorris</span><span class="role">Elder</span></div>' +
          '<div class="row"><span>Maynard Skidmore</span><span class="role">Elder</span></div>' +
          '<div class="row"><span>Andy Weld</span><span class="role">Elder</span></div>' +
          '<div class="row"><span>Scott York</span><span class="role">Deacon</span></div>' +
        '</div>' +
        '<p class="back-giving">Reach the session through the church office. Giving by check, made out to Bonita Orthodox Presbyterian Church, placed in the offering plate. <span class="todo">Online giving: see MODERNIZATION-ROADMAP.md</span></p>' +
      '</div>' +
      '<div class="back-middle">' +
        '<hr class="rule-double">' +
        '<p class="back-verse">&ldquo;Better is one day in your courts than a thousand elsewhere.&rdquo;<cite>Psalm 84:10</cite></p>' +
      '</div>' +
      '<div class="back-bottom">' +
        '<div class="back-contact">' +
          '5111 Central Avenue, Bonita, CA 91902<br>' +
          '(619) 475-3752 &middot; bonitaopc.org<br>' +
          '[info@bonitaopc.org] <span class="todo">confirm</span>' +
        '</div>' +
        '<p class="back-tagline">Gathered in Bonita since 1972</p>' +
      '</div>';
    return el;
  }

  function page2Panel() {
    var el = document.createElement("div");
    el.className = "panel panel--inside";
    el.innerHTML =
      '<div class="inside-head">' +
        '<span class="cw">The Lord&rsquo;s Day &middot; [Month Day, Year]</span> <span class="todo">set weekly</span>' +
        '<p class="verse">Order of Worship &mdash; Morning</p>' +
      '</div>' +
      '<p class="order-sub">&#42; the congregation stands as able</p>' +
      '<div class="liturgy">' +
        '<div class="row"><span class="what">Prelude</span><span class="ref"></span></div>' +
        '<div class="row"><span class="what">Welcome &amp; Announcements</span><span class="ref"></span></div>' +
        '<div class="row"><span class="what">&#42; Call to Worship</span><span class="ref">[Scripture] <span class="todo">fill in</span></span></div>' +
        '<div class="row hymn"><span class="what">&#42; Hymn of Praise</span><span class="ref">&ldquo;[Title]&rdquo; No. [ ] <span class="todo">fill in</span></span></div>' +
        '<div class="row"><span class="what">&#42; Invocation</span><span class="ref"></span></div>' +
        '<div class="row"><span class="what">Confession of Sin</span><span class="ref">[in unison] <span class="todo">fill in</span></span></div>' +
        '<div class="row"><span class="what">Assurance of Pardon</span><span class="ref">[Scripture] <span class="todo">fill in</span></span></div>' +
        '<div class="row hymn"><span class="what">&#42; Hymn of Assurance</span><span class="ref">&ldquo;[Title]&rdquo; No. [ ] <span class="todo">fill in</span></span></div>' +
        '<div class="row"><span class="what">Old Testament Reading</span><span class="ref">[passage] <span class="todo">fill in</span></span></div>' +
        '<div class="row"><span class="what">Pastoral Prayer</span><span class="ref"></span></div>' +
        '<div class="row hymn"><span class="what">&#42; Hymn of Preparation</span><span class="ref">&ldquo;[Title]&rdquo; No. [ ] <span class="todo">fill in</span></span></div>' +
        '<div class="row sermon"><span class="what">Sermon &mdash; &ldquo;Judgment for Turning Back&rdquo;</span><span class="ref">Zephaniah 1:1&ndash;6</span></div>' +
        '<div class="row"><span class="what">Preached by John Joseph Matandika</span><span class="ref"></span></div>' +
        '<div class="row hymn"><span class="what">&#42; Hymn of Response</span><span class="ref">&ldquo;[Title]&rdquo; No. [ ] <span class="todo">fill in</span></span></div>' +
        '<div class="row"><span class="what">&#42; Benediction</span><span class="ref"></span></div>' +
      '</div>' +
      '<p class="footnote">Sunday School meets at 9:30 a.m. <span class="todo">confirm</span>. Both services stream live on our YouTube channel.</p>';
    return el;
  }

  function page3Panel() {
    var el = document.createElement("div");
    el.className = "panel panel--inside";
    el.innerHTML =
      '<div class="inside-head"><span class="cw">Evening Worship &middot; 6:00 p.m.</span></div>' +
      '<div class="liturgy" style="margin-bottom:.2in;">' +
        '<div class="row sermon"><span class="what">Sermon &mdash; &ldquo;Redemption in Christ&rdquo;</span><span class="ref">Ephesians 1:1&ndash;14</span></div>' +
      '</div>' +
      '<hr class="rule-double">' +
      '<p class="section-label">This week &amp; next</p>' +
      '<div class="announce-item">' +
        '<p class="what">Next Sunday &mdash; Communion</p>' +
        '<p>Followed by the Feast Day fellowship meal. Sign-up sheet on the back table.</p>' +
      '</div>' +
      '<div class="announce-item">' +
        '<p class="what">Wednesday &mdash; Family Bible Study &amp; Prayer</p>' +
        '<p>6:00&ndash;8:00 p.m., Rohr Park, Gate A. <span class="todo">confirm</span></p>' +
      '</div>' +
      '<div class="announce-item">' +
        '<p class="what">[This week&rsquo;s announcement] <span class="todo">fill in</span></p>' +
        '<p>[A baptism, a members&rsquo; meeting, a visiting speaker.]</p>' +
      '</div>' +
      '<p class="section-label" style="margin-top:.18in;">Prayers of the congregation</p>' +
      '<div class="prayer-lines">' +
        '<div class="line"></div><div class="line"></div><div class="line"></div><div class="line"></div>' +
      '</div>';
    return el;
  }

  // Print sheets — booklet imposition: outside = back | front, inside = page2 | page3.
  var outside = document.getElementById("outside-sheet");
  outside.appendChild(backPanel());
  outside.appendChild(coverPanel());

  var inside = document.getElementById("inside-sheet");
  inside.appendChild(page2Panel());
  inside.appendChild(page3Panel());

  // Mockups — independent copies so the print sheets above stay untouched.
  document.getElementById("mock-cover").replaceWith((function () { var w = coverPanel(); w.id = "mock-cover"; return w; })());
  var spread = document.getElementById("mock-spread");
  spread.appendChild(page2Panel());
  spread.appendChild(page3Panel());
})();
</script>

</body>
</html>
