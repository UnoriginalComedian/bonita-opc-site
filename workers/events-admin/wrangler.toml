name = "bonita-events-admin"
main = "src/index.js"
compatibility_date = "2024-09-01"

kv_namespaces = [
  { binding = "EVENTS", id = "a2a30c59e3d042fc9508c3084f68ecfc" }
]

routes = [
  { pattern = "bonitaopc.org/admin", zone_name = "bonitaopc.org" },
  { pattern = "bonitaopc.org/admin/*", zone_name = "bonitaopc.org" },
  { pattern = "bonitaopc.org/api/*", zone_name = "bonitaopc.org" },
  # Every other page too, only so plain http:// visits get a real redirect to
  # https:// (and an HSTS header); the pages themselves pass straight through
  # to GitHub Pages untouched.
  { pattern = "bonitaopc.org/*", zone_name = "bonitaopc.org" },
  { pattern = "www.bonitaopc.org/*", zone_name = "bonitaopc.org" }
]
